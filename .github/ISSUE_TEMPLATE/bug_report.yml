name: Bug report
description: Something in the subscriptions feed does not update correctly
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /feed/subscriptions
        2. ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 130, Firefox 142, ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: 0.0.9
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or extra context
      description: A screenshot of the affected section usually helps.
    validations:
      required: false
